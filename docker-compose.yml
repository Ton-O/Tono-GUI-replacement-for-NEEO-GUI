services:
  node:
    build:
      context: ./node/
      dockerfile: Dockerfile
    container_name: Node
    hostname: Node
    image: nodetono:release
    working_dir: /app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    #volumes: uncomment this line and the next to use your own modules; no need, but possible
    #  - /media/local/Node/app:/app
    ports:
      - 80:8080
    command: node  /app/StartServer.js
